on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
          git switch ${{ github.event.pull_request.head.ref || github.ref_name }}
          echo "SHA $(git rev-parse HEAD)"
      - run: npm install
      - run: npm audit
      - run: npm run compile
      - run: npm run lint
